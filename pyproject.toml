[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkanalyze"
version = "0.1.0"
description = "Receipt ingestion and categorization service for Telegram and email"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CheckAnalyze" }
]
dependencies = [
  "python-telegram-bot>=20,<21",
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
  "pdfplumber>=0.9",
  "pytesseract>=0.3",
  "pdf2image>=1.16",
  "Pillow>=9.5",
  "rapidfuzz>=3.0",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "typer>=0.9",
  "structlog>=23.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-mock>=3.11"
]

[project.scripts]
checkanalyze = "checkanalyze.cli:app"
