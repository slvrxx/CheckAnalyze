[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkanalyze"
version = "0.1.0"
description = "Receipt ingestion and categorization service for Telegram and email"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CheckAnalyze" }
]
dependencies = [
  "python-telegram-bot>=20,<21",
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
  "typer>=0.9",
  "structlog>=23.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-mock>=3.11",
  "pytest-postgresql>=5.1",
  "black>=23.0",
  "isort>=5.12",
  "ruff>=0.1",
  "mypy>=1.5",
  "pre-commit>=3.4"
]

[project.scripts]
checkanalyze = "checkanalyze.cli:app"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "ASYNC", "Q"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
plugins = []
ignore_missing_imports = true
